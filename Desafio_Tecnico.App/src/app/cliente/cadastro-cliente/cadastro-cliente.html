<div class="min-h-screen flex items-center justify-center bg-gray-50 p-6">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">Cadastro de Cliente</h2>
    
    <div class="space-y-5">
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Nome</label>
        <input 
          id="name" 
          formControlName="name" 
          placeholder="Digite seu nome"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none" 
        />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <p class="text-red-500 text-xs mt-1 font-medium">Nome deve ter entre 3 a 10 caracteres.</p>
        }
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
        <input 
          id="email" 
          type="email"
          formControlName="email" 
          placeholder="seu@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none" 
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <p class="text-red-500 text-xs mt-1 font-medium">Email deve ser válido (3-30 caracteres).</p>
        }
      </div>
    </div>

    <button 
      type="submit" 
      [disabled]="form.invalid" 
      class="w-full mt-8 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200 shadow-md"
    >
      Finalizar Cadastro
    </button>
  </form>
</div>
