<div class="login-page">
  <div class="background-elements" aria-hidden="true">
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
    <div class="gradient-lines"></div>
  </div>

  <main class="login-panel">
    <div class="login-card">
      <header class="login-header">
        <div class="logo-mark">
          <mat-icon>lock_open</mat-icon>
        </div>
        <h2>Entrar na conta</h2>
        <p>Informe suas credenciais para continuar</p>
      </header>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>E-mail ou usuário</mat-label>
          <input matInput type="text" placeholder="joao@email.com" autocomplete="username" required />
          <mat-icon matPrefix>alternate_email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <mat-icon matPrefix>key</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="form-row">
          <mat-checkbox color="primary">Lembrar de mim</mat-checkbox>
          <a href="#" class="link-muted">Esqueceu a senha?</a>
        </div>

        <button mat-flat-button color="primary" type="submit" class="submit-btn">
          <span>Entrar</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>

        <div class="divider">
          <span>ou continue com</span>
        </div>

        <div class="social-row">
          <button mat-stroked-button type="button" class="social-btn" aria-label="Entrar com Google">
            <mat-icon>account_circle</mat-icon>
            Google
          </button>
          <button mat-stroked-button type="button" class="social-btn" aria-label="Entrar com GitHub">
            <mat-icon>code</mat-icon>
            GitHub
          </button>
        </div>
      </form>

      <p class="signup-hint">
        Ainda não tem conta?
        <a href="#">Criar conta gratuita</a>
      </p>
    </div>
  </main>
</div>
